[project]
name = "purchasing-backend"
version = "0.1.0"
description = "Backend FastAPI com o agente de compras e as rotas de requisições"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201", "FAST"]
ignore = ["E501", "B008", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.environment]
root = ["."]

[tool.ty.terminal]
error-on-warning = true
