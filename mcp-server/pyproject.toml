[project]
name = "catalog-mcp"
version = "0.1.0"
description = "Servidor MCP com as ferramentas buscar_produtos e detalhar_produto sobre a DummyJSON"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
ignore = ["E501", "B008", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ty.environment]
root = ["./src", "."]

[tool.ty.terminal]
error-on-warning = true
