name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  OPENROUTER_API_KEY: dummy
  OPENROUTER_MODEL: dummy
  POSTGRES_PASSWORD: dummy
  INTERNAL_API_TOKEN: dummy-internal-token

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [mcp-server, backend]
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env
      - run: docker compose --profile test run --rm --build ${{ matrix.service }}-tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env
      - run: docker compose config -q
