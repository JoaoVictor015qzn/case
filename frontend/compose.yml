services:
  frontend:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-120000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
